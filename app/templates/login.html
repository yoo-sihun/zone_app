<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ZONE — 로그인</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="authwrap">
  <div class="authcard">
    <h1>ZONE</h1>
    <input id="email" type="email" placeholder="이메일" autocomplete="username">
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn primary" id="submitBtn">로그인</button>
    <div class="autherr" id="err"></div>
    <div class="switch">계정이 없으신가요? <a id="toggleMode">회원가입</a></div>
  </div>
</div>

<script>
let mode = 'login'; // 'login' | 'register'
const $ = s => document.querySelector(s);

function bindToggle(){
  document.getElementById('toggleMode').onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    $('#submitBtn').textContent = mode === 'login' ? '로그인' : '회원가입';
    $('.switch').innerHTML = mode === 'login'
      ? '계정이 없으신가요? <a id="toggleMode">회원가입</a>'
      : '이미 계정이 있으신가요? <a id="toggleMode">로그인</a>';
    bindToggle();
  };
}
bindToggle();

$('#submitBtn').onclick = async () => {
  const email = $('#email').value.trim();
  const password = $('#password').value;
  $('#err').textContent = '';
  if(!email || !password){ $('#err').textContent = '이메일과 비밀번호를 입력하세요'; return; }
  const res = await fetch(`/api/auth/${mode}`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email, password})
  });
  if(res.ok){
    location.href = '/';
  } else {
    const data = await res.json().catch(() => ({}));
    $('#err').textContent = data.detail || '오류가 발생했습니다';
  }
};

['#email', '#password'].forEach(sel => {
  $(sel).addEventListener('keydown', e => { if(e.key === 'Enter') $('#submitBtn').click(); });
});
</script>
</body>
</html>
